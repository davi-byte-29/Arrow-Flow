<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<title>Arrow Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <button id="btnBack" class="round" aria-label="Níveis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="center">
      <span id="diff" class="pill">FÁCIL</span>
      <h1 id="title">Nível 1</h1>
      <div id="hearts"></div>
    </div>
    <button id="btnRestart" class="round" aria-label="Reiniciar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
    </button>
  </header>
  <div id="bar"><i id="barFill"></i></div>
  <main id="stage"><canvas id="cv"></canvas></main>
</div>

<div id="overlay" class="hidden">
  <div class="card">
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <button id="ovBtn" class="btn"></button>
    <button id="ovLevels" class="btn ghost">Níveis</button>
  </div>
</div>

<div id="levels" class="hidden">
  <div class="card wide">
    <h2>Níveis</h2>
    <div id="lvGrid"></div>
    <button id="lvClose" class="btn ghost">Fechar</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
