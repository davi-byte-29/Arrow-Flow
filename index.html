<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Arrow Flow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <button id="btnBack" class="round" aria-label="Níveis">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d38cae" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="center"><span id="diff" class="pill">FÁCIL</span><h1 id="title">Nível 1</h1></div>
    <button id="btnRestart" class="round" aria-label="Reiniciar">
      <svg viewBox="0 0 24 24" fill="#d38cae"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
    </button>
  </header>
  <div id="hearts"></div>
  <div id="bar"><i id="barFill"></i></div>
  <main id="stage"><canvas id="cv"></canvas></main>
</div>

<div id="overlay" class="hidden">
  <div class="card">
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <button id="ovBtn" class="btn"></button>
    <button id="ovLevels" class="btn ghost">Níveis</button>
  </div>
</div>

<div id="levels" class="hidden">
  <div class="card">
    <h2>Níveis</h2>
    <div id="lvGrid"></div>
    <button id="lvClose" class="btn ghost">Fechar</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
